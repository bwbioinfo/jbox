# Generated by `jbox init`. This primary repository is the workspace.
version = 1

[runtime]
backend = "kata"

[resources]
cpus = 8
memory = "16G"
disk = "40G" # Recorded for future VM disk sizing, not enforced by Docker/Kata yet.
ttl = "24h"

[image]
dockerfile = ".jbox/Dockerfile"

[workspace]
mount = "/workspace/project"

[network]
internet = true
host = false
lan = false

[jcode]
persistent_credentials = true
# Startup overrides. --update changes recognized model versions only, not
# provider, effort, service tier, credentials, or intentional inheritance.
default_provider = "openai"
default_model = "gpt-6.1-sol"
openai_reasoning_effort = "medium"
openai_service_tier = "off"

# Managed default sources are merged by --update. Project sources and explicit
# pins, private-source declarations, selectors and hidden-directory policy stay yours.
[[jcode.skills]]
repository = "bwbioinfo/skills"
private = true
managed = true

# [[jcode.skills]]
# repository = "K-Dense-AI/scientific-agent-skills"
# skill = "scanpy"
# pin = "v1.2.3"
# allow_hidden_dirs = true
# private = false

# Managed session guidance. `jbox init --update` replaces instructions here.
# Mounted in ~/AGENTS.md, never written into the generated Git worktree.
[jcode.agent.jbox]

# Project-owned session guidance, never changed by `jbox init --update`.
# Add instructions here, or keep repository guidance in your project AGENTS.md.
[jcode.agent.project]
# instructions = "Run the project's complete test suite before finishing."

[git]
network = true
# GitHub CLI credentials support private Git remotes and optional skills.
# Jbox mounts only ~/.config/gh/hosts.yml, read-only, into the guest.
credentials = "github-cli"

[git.author]
# Read user.name and user.email from the host global Git config without
# mounting it into the guest. Set either key here to override that field.
inherit_host = true
# name = "Your Name"
# email = "you@example.com"
