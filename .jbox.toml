# Project-local jbox workspace configuration.
version = 1

[runtime]
backend = "kata"

[workspace]
mount = "/workspace/jbox"

[[repos]]
path = "../skills"
mount = "/workspace/skills"

[image]
dockerfile = ".jbox/Dockerfile"

[resources]
cpus = 8
memory = "16G"
disk = "40G"
ttl = "24h"

[network]
internet = true
host = false
lan = false

[jcode]
persistent_credentials = true
# These project defaults override the host Jcode client for jbox sessions.
# Remove an option to inherit that value from the host Jcode client instead.
# Claude-first startup, using the newest subscription-listed Sonnet tier checked
# on 2026-10-06. Re-check the catalog when newer versions become available.
default_provider = "claude"
default_model = "claude-sonnet-5"
openai_reasoning_effort = "high"
openai_service_tier = "priority"

[[jcode.skills]]
# Every configured GitHub repository is installed by `gh skill install` in the guest.
# Omit `skill` to install every discoverable skill from this private repository.
repository = "bwbioinfo/skills"

[[jcode.skills]]
# Install the named public scientific skill alongside the complete private skill set.
repository = "K-Dense-AI/scientific-agent-skills"
skill = "scanpy"

[jcode.agent]
# This is session-scoped guest guidance. It is mounted as ~/AGENTS.md and
# never changes this repository's generated Git worktree.
instructions = """
Use the `work-with-geonic` skill for all work in this workspace.
Use the `jcode-jbox` skill for Jbox workspace, lifecycle, isolation, credential, Jcode configuration, remote-session, and authentication tasks.

Use subscription-backed providers efficiently and only within their terms.
At session start, before spawning workers, and after a provider error, check
`jcode auth status --json` and `jcode usage --json` in the guest. Treat only
guest-reported, authenticated providers and their live allowance windows as eligible.

For substantial work, split independent tasks and route new swarm workers to
the appropriate viable subscription-backed model. Prioritize Claude for new
work and deplete its included allowance before OpenAI, even when OpenAI has
more remaining capacity. Use OpenAI only when Claude is exhausted, cannot
safely fit the next task within its live limits, is unauthenticated or unavailable,
or lacks a required capability.

For both Claude and OpenAI, use the newest catalog-listed version of the chosen
model tier. Check `swarm list_models` or
`jcode --quiet --provider <id> model list --json` for exact subscription routes.
Adjust only the model tier and supported reasoning effort to the problem, not
the model's age. Use lighter tiers for bounded implementation, research, bulk
reading, and mechanical verification. Use stronger tiers for planning,
integration, difficult debugging, and adversarial review. Never invent model
names, inherit a stale worker default unchecked, or use an older version without
explicit user approval. Pass the selected route explicitly for new workers.

Keep an active conversation on its provider unless a fresh worker has a clean
handoff. When Claude cannot safely fit the next task within its remaining
allowance, route eligible new tasks to OpenAI. Re-check Claude's eligibility
after its allowance resets and prefer it again for new work. Do not create work
merely to consume allowance, retry quota failures to evade limits, use unapproved
accounts, or enable API or extra paid usage without explicit user approval.
"""

[git]
network = true
credentials = "github-cli"

[git.author]
# Read user.name and user.email from the host global Git config without
# mounting it into the guest. Set either key here to override that field.
inherit_host = true
# name = "Your Name"
# email = "you@example.com"
